<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f0e1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Enekén Studio — arquitectura escultórica. Mérida · CDMX. Demo conceptual por Alessia Studio." />
    <title>Enekén Studio — Arquitectura escultórica</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="is-loading on-paper">
    <canvas id="gl" aria-hidden="true"></canvas>

    <div id="loader" class="loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="loader">
      <div class="loader-mark">
        <svg id="loader-logo" class="logo-svg" aria-hidden="true"></svg>
        <p class="wordmark" aria-hidden="true">ENEKĒN</p>
      </div>
    </div>

    <header class="top" id="top">
      <a class="mark" href="#nosotros" id="mark" aria-label="Enekén Studio">
        <svg id="mark-logo" class="logo-svg" aria-hidden="true"></svg>
        <span class="mark-name">Enekēn</span>
      </a>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><span aria-hidden="true">/</span><button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <nav class="stops" id="stops" data-i18n-aria="nav">
      <a href="#nosotros" data-stop="0"><span data-i18n="nav.nosotros"></span></a>
      <a href="#vision" data-stop="1"><span data-i18n="nav.vision"></span></a>
      <a href="#contacto" data-stop="2"><span data-i18n="nav.contacto"></span></a>
    </nav>

    <div class="pins" id="pins">
      <button type="button" class="pin" data-pin="0"><i aria-hidden="true"></i><span data-i18n="nav.nosotros"></span></button>
      <button type="button" class="pin" data-pin="1"><i aria-hidden="true"></i><span data-i18n="nav.vision"></span></button>
      <button type="button" class="pin" data-pin="2"><i aria-hidden="true"></i><span data-i18n="nav.contacto"></span></button>
    </div>

    <div class="panels">
      <section class="panel" id="nosotros" data-panel="0" aria-labelledby="nos-k">
        <p class="kicker" id="nos-k" data-i18n="nos.k"></p>
        <h1 class="ptitle" data-i18n="nos.t"></h1>
        <p class="ptext" data-i18n="nos.p"></p>
        <figure class="person">
          <img id="miguel" alt="Miguel Tapia" width="474" height="582" decoding="async" />
          <figcaption><span class="pname" data-i18n="nos.name"></span><span class="prole" data-i18n="nos.role"></span></figcaption>
        </figure>
      </section>
      <section class="panel bottom" id="vision" data-panel="1" aria-labelledby="vis-k">
        <p class="kicker" id="vis-k" data-i18n="vis.k"></p>
        <p class="manifesto">
          <span class="hand" data-i18n="vis.1"></span>
          <span class="line" data-i18n="vis.2"></span>
          <span class="line" data-i18n="vis.3"></span>
          <span class="line" data-i18n="vis.4"></span>
        </p>
      </section>
      <section class="panel bottom" id="contacto" data-panel="2" aria-labelledby="con-k">
        <p class="kicker" id="con-k" data-i18n="con.k"></p>
        <a class="mail" href="mailto:info@nkn.mx">info@nkn.mx</a>
        <a class="ig" href="https://www.instagram.com/nkn.studio/" target="_blank" rel="noopener">@nkn.studio</a>
        <p class="cities" data-i18n="con.cities"></p>
      </section>
    </div>

    <main id="track" class="track">
      <div id="seq" class="seq"></div>
    </main>

    <footer class="credit" data-i18n="credit"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
