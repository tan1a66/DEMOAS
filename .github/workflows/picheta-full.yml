# TEMPORANEO: foto scelte a piena risoluzione + video della terrazza dal sito ufficiale. Va rimosso dopo l'uso.
name: Picheta · foto a piena risoluzione
on:
  push:
    branches: [claude/serene-pasteur-g45xkd]
    paths: ['.github/picheta/select.json', '.github/picheta/select.py', '.github/workflows/picheta-full.yml']
permissions:
  contents: write
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/serene-pasteur-g45xkd
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Scarica
        run: python3 .github/picheta/select.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add picheta/_source/full
          git commit -m "Picheta: foto scelte a piena risoluzione e video della terrazza (temporaneo)"
          for i in 1 2 3 4; do
            git pull --rebase origin claude/serene-pasteur-g45xkd && git push origin HEAD:claude/serene-pasteur-g45xkd && exit 0
            sleep $((i * 5))
          done
          exit 1
