# Una tantum: mappe di profondità (Depth Anything V2) per le foto dell'hero. Va rimosso dopo l'uso.
name: Picheta · profondità
on:
  push:
    branches: [claude/nifty-cray-jz19r9]
    paths: ['.github/workflows/picheta-depth.yml']
permissions:
  contents: write
jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-cray-jz19r9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install transformers==4.46.3 pillow==11.3.0 numpy==2.1.3
      - name: Depth Anything V2
        run: |
          python3 - <<'PY'
          import numpy as np, torch
          from PIL import Image
          from transformers import AutoImageProcessor, AutoModelForDepthEstimation
          torch.set_num_threads(4)
          name = 'depth-anything/Depth-Anything-V2-Large-hf'
          proc = AutoImageProcessor.from_pretrained(name)
          model = AutoModelForDepthEstimation.from_pretrained(name).eval()

          def depth(path, size, out_wh):
              im = Image.open(path).convert('RGB')
              inputs = proc(images=im, return_tensors='pt', size={'height': size, 'width': size})
              with torch.no_grad():
                  d = model(**inputs).predicted_depth[None]
              d = torch.nn.functional.interpolate(d, size=(out_wh[1], out_wh[0]), mode='bicubic', align_corners=False)[0, 0].numpy()
              lo, hi = np.percentile(d, 0.5), np.percentile(d, 99.5)
              print(path, inputs['pixel_values'].shape, float(lo), float(hi))
              return np.clip((d - lo) / (hi - lo), 0, 1)

          def save(a, out):
              Image.fromarray((a * 255 + 0.5).astype(np.uint8), 'L').save(out, optimize=True)
              print(out)

          H = 'picheta/public/hero/'
          # Terraza: las cuatro luces están alineadas → media de las cuatro (más robusta).
          maps = [depth(f'{H}terraza-{n}-d.webp', 1036, (1024, 1024)) for n in ['dia', 'dorada', 'azul', 'noche']]
          for n, m in zip(['dia', 'dorada', 'azul', 'noche'], maps):
              save(m, f'/tmp/terraza-{n}-depth.png')
          save(np.mean(maps, axis=0), f'{H}terraza-depth.png')
          # Cocina vertical: ancho 518 en el modelo (proporción conservada), salida 640 de ancho.
          save(depth(f'{H}cocina-d.webp', 518, (640, 2580)), f'{H}cocina-depth.png')
          PY
          mkdir -p picheta/depth-check && cp /tmp/terraza-*-depth.png picheta/depth-check/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add picheta/public/hero/terraza-depth.png picheta/public/hero/cocina-depth.png picheta/depth-check
          git commit -m "Picheta: mappe di profondità (Depth Anything V2)"
          git push origin HEAD:claude/nifty-cray-jz19r9
