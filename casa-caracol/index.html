<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="color-scheme" content="light" />
    <title>Casa Caracol · Isla Mujeres</title>
    <meta name="description" content="Una casa con forma de caracol en Isla Mujeres. Dos conchas, piscina privada, el mar enfrente. Reserva directo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- CSS crítico: el loader se pinta antes de que llegue cualquier otro recurso -->
    <style>
      html, body { margin: 0; background: #F4F1EA; }
      .loader {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #F4F1EA;
        transition: opacity 1.1s cubic-bezier(.4, 0, .2, 1), visibility 0s linear 1.1s;
      }
      .loader.is-done { opacity: 0; visibility: hidden; }
      .loader__caustic { width: 132px; height: 132px; display: block; }
      .loader__fallback {
        width: 84px; height: 84px; border-radius: 50%;
        background: radial-gradient(circle, rgba(191,220,211,.9), rgba(191,220,211,0) 70%);
        animation: ccPulse 2.4s ease-in-out infinite;
      }
      @keyframes ccPulse { 50% { transform: scale(1.12); opacity: .6; } }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" aria-hidden="true">
      <canvas class="loader__caustic" id="loader-caustic" width="264" height="264"></canvas>
    </div>
    <script>
      // Cáustica mínima en WebGL puro (sin three.js): visible en el primer pintado.
      (function () {
        var c = document.getElementById('loader-caustic');
        var gl = c && (c.getContext('webgl', { premultipliedAlpha: true, antialias: false }) || null);
        var stop = false, t0 = performance.now();
        window.__loader = {
          hide: function () {
            var el = document.getElementById('loader');
            if (el) el.classList.add('is-done');
            setTimeout(function () { stop = true; }, 1200);
          },
        };
        if (!gl) {
          var f = document.createElement('div');
          f.className = 'loader__fallback';
          c.replaceWith(f);
          return;
        }
        var vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
        var fs = [
          'precision mediump float;uniform float t;uniform vec2 r;',
          'vec2 h(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}',
          'float v(vec2 p,float t){vec2 i=floor(p),f=fract(p);float a=8.,b=8.;',
          'for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 o=h(i+g);o=.5+.4*sin(t*(.6+.5*o.yx)+6.2831*o);',
          'vec2 d=g+o-f;float e=dot(d,d);if(e<a){b=a;a=e;}else if(e<b)b=e;}return sqrt(b)-sqrt(a);}',
          'void main(){vec2 u=(gl_FragCoord.xy-.5*r)/r.y;float d=length(u);',
          'vec2 p=u*3.4;p+=.16*vec2(sin(p.y*2.1+t*.5),cos(p.x*1.9-t*.45));',
          'float e=v(p,t*.8),e2=v(p*1.37+3.1,-t*.6+7.);',
          'float l=exp(-e*e*70.),l2=exp(-e2*e2*90.);',
          'float c=l*.75+l2*.45+l*l2*.9;',
          'float m=smoothstep(.5,.12,d);',
          'vec3 agua=vec3(.749,.863,.827);',
          'vec3 col=mix(agua,vec3(1.),clamp(c,0.,1.));',
          'float a=m*(.42+.58*clamp(c,0.,1.));',
          'gl_FragColor=vec4(col*a,a);}',
        ].join('\n');
        function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
        var pr = gl.createProgram();
        gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
        gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(pr);
        if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
        gl.useProgram(pr);
        var b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(pr, 'p');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        var ut = gl.getUniformLocation(pr, 't'), ur = gl.getUniformLocation(pr, 'r');
        gl.uniform2f(ur, c.width, c.height);
        gl.clearColor(0, 0, 0, 0);
        (function frame(now) {
          if (stop) { var ext = gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); return; }
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.uniform1f(ut, (now - t0) / 1000);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          requestAnimationFrame(frame);
        })(t0);
      })();
    </script>

    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="veil" id="veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="nav" id="nav">
      <a class="nav__logo" href="#top" data-i18n="brand">Casa Caracol</a>
      <div class="nav__right">
        <div class="lang" role="group" aria-label="Idioma / Language">
          <button class="lang__btn" type="button" data-lang="es" aria-pressed="true">ES</button>
          <span class="lang__sep" aria-hidden="true">·</span>
          <button class="lang__btn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="sound" id="sound" type="button" aria-pressed="false" data-i18n-aria="sound.on">
          <svg class="sound__icon" viewBox="0 0 32 32" aria-hidden="true">
            <path class="sound__speaker" d="M6 12.5h4.2L16 7.5v17l-5.8-5H6z" />
            <path class="sound__wave sound__wave--1" d="M19.6 12.6a4.6 4.6 0 0 1 0 6.8" />
            <path class="sound__wave sound__wave--2" d="M22.4 9.8a8.6 8.6 0 0 1 0 12.4" />
            <path class="sound__wave sound__wave--3" d="M25.2 7a12.6 12.6 0 0 1 0 18" />
            <path class="sound__mute" d="M20.5 13l6 6m0-6l-6 6" />
          </svg>
        </button>
        <a class="nav__book" id="nav-book" href="#reservar" data-i18n="nav.book">Reservar</a>
      </div>
    </header>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Capa de textos de la historia (fija; su estado lo mueve el scroll) -->
    <div class="overlay" id="overlay">
      <div class="overlay__intro">
        <h1 class="line line--intro" id="t-intro" data-i18n="intro.title">Acerca el oído</h1>
        <p class="hint" id="t-tap" data-i18n="intro.tap">Toca para escuchar el mar</p>
      </div>
      <div class="overlay__story">
        <p class="line line--a" id="t-a" data-i18n="descent.line">No es solo un caracol…</p>
        <p class="line line--b" id="t-b" data-i18n="cut.line">…es donde vas a dormir.</p>
      </div>
      <div class="scrollhint" id="scrollhint" aria-hidden="true">
        <span class="scrollhint__label" data-i18n="intro.scroll">Desliza</span>
        <span class="scrollhint__track"><span class="scrollhint__dot"></span></span>
      </div>
      <a class="skip" id="skip" href="#casa"><span data-i18n="intro.skip">Ver la casa</span> <span aria-hidden="true">→</span></a>
    </div>

    <main id="top">
      <!-- Espaciador alto: el scroll recorre la historia 3D mientras el lienzo queda fijo -->
      <section class="story" id="story" aria-label="Casa Caracol"></section>

      <section class="casa" id="casa">
        <div class="casa__inner">
          <p class="casa__kicker" data-i18n="phase.kicker">Fase 2</p>
          <p class="casa__title" data-i18n="phase.title">Túnel y secciones de la casa</p>
          <p class="casa__note" data-i18n="phase.note">Aquí llegan el túnel de nácar y las fotos de la casa.</p>
        </div>
      </section>
    </main>

    <noscript>
      <p style="font-family: Georgia, serif; padding: 2rem; text-align: center">Casa Caracol · Isla Mujeres</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
