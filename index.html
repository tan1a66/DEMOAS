<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>URBAZ — Experiencia 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl" aria-label="Mapa 3D de la península de Yucatán"></canvas>
      <div id="labels" aria-live="polite"></div>
      <div id="mist" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="topbar" id="topbar">
        <a class="logo" href="#" id="logo" aria-label="URBAZ — volver a la península">URBAZ</a>
        <div class="topbar-slot" id="search-slot"></div>
        <div class="lang" role="group" aria-label="Idioma">
          <button data-lang="es" class="active">ES</button><span>/</span><button data-lang="en">EN</button>
        </div>
      </header>

      <section class="hud" id="hud">
        <p class="kicker" id="hud-kicker"></p>
        <h1 class="title" id="hud-title"></h1>
        <p class="sub" id="hud-sub"></p>
      </section>

      <nav class="cities" id="cities" aria-label="Ciudades"></nav>

      <button class="back" id="back" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        <span data-i18n="nav.back"></span>
      </button>

      <button class="skip" id="skip" type="button" data-i18n="intro.skip"></button>

      <p class="legend" id="legend"><i></i><span data-i18n="route.tren"></span></p>
      <p class="credit" data-i18n="nav.proposal"></p>

      <div id="loader" class="loader">
        <div class="loader-inner">
          <div class="loader-logo">URBAZ</div>
          <p class="loader-tag" data-i18n="loader.tagline"></p>
          <div class="bar"><span id="bar-fill"></span></div>
          <p class="loader-step"><span data-i18n="loader.loading"></span> · <span id="loader-step"></span> <b id="loader-pct">0%</b></p>
          <button class="enter" id="enter" type="button" data-i18n="loader.enter"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
