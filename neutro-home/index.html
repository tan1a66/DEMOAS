<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ddd1c1" />
    <title>Neutro Home · La Trenza</title>
    <!-- Créditos: palmeras "Palm Tree Realistic" de 00amza (sketchfab.com/00amza), licencia CC BY 4.0. -->
    <meta name="credits" content="Palm Tree Realistic by 00amza (Sketchfab), CC BY 4.0" />
    <meta name="description" content="Trenza Maya de Neutro Home: tejida a mano en Yucatán. Tócala, cambia su color y pídela así." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Italiana&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Pantalla de carga: visible desde el primer instante, antes de cargar el JS. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ddd1c1;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ddd1c1;
        z-index: 50;
        transition: opacity 0.9s ease;
      }
      #loader.out {
        opacity: 0;
        pointer-events: none;
      }
      #loader svg {
        width: 46px;
        height: 120px;
        overflow: visible;
      }
      #loader path {
        fill: none;
        stroke: #8a5a44;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-dasharray: 40 200;
        animation: thread 2.4s cubic-bezier(0.45, 0, 0.25, 1) infinite;
        opacity: 0.85;
      }
      @keyframes thread {
        0% {
          stroke-dashoffset: 40;
        }
        100% {
          stroke-dashoffset: -200;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader path {
          animation: none;
          stroke-dasharray: none;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" aria-label="Cargando">
      <svg viewBox="0 0 46 120" aria-hidden="true">
        <path d="M23 0 C 23 20, 10 30, 23 45 S 36 70, 23 85 S 10 105, 23 120" />
      </svg>
    </div>

    <main id="app">
      <canvas id="gl" aria-label="Piezas de Neutro Home tejidas a mano: la Trenza Maya y las lámparas Makech y Xux. Arrastra la trenza o haz girar las lámparas; desliza para pasar a la siguiente pieza."></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="brand" id="brand">
        <span class="logo">NEUTRO HOME</span>
      </header>

      <p class="intro-line" id="introLine">HANDMADE IN YUCATAN</p>


      <section class="piece" id="piece">
        <div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div>
      </section>
      <button type="button" class="next-hint" id="nextHint" aria-label="Siguiente pieza"><span></span></button>
      <nav class="dots" id="dots" aria-label="Paradas"></nav>

      <!-- nombre de cada pieza: aparece en el camino y se va al llegar -->
      <div class="chapter" id="chapter" aria-hidden="true"></div>
      <!-- final: bajo el muro pintado -->
      <nav class="end-links" id="endLinks" aria-label="Neutro Home">
        <a class="float-btn" href="#history" data-go="history">OUR HISTORY</a>
        <a class="float-btn" href="#shop" data-go="shop">SHOP</a>
      </nav>
      <button type="button" class="skip" id="skipIntro" aria-label="Saltar la entrada">SKIP</button>
      <button type="button" class="sound" id="soundBtn" aria-pressed="false" aria-label="Sonido">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z" /><path class="w1" d="M14.6 9.2a4 4 0 0 1 0 5.6" /><path class="w2" d="M17.1 6.8a7.4 7.4 0 0 1 0 10.4" /><path class="x" d="M15 9.5l5 5M20 9.5l-5 5" /></svg>
      </button>
      <div class="ghost-finger" id="ghostFinger" aria-hidden="true"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="cursor" id="cursor" aria-hidden="true"></div>
      <div class="touch-ring" id="touchRing" aria-hidden="true"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
