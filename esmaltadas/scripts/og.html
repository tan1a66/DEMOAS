<!doctype html><html><head><meta charset="utf-8">
<!-- Anteprima del link (1200×630) → public/og-esmaltadas.jpg. La seta è una foto del sito vero:
     silk-portrait.png = la prima schermata a 760×1000, 2×, con nome e barra nascosti (stessa
     cartella). Si apre nel browser a 1200×630 e si salva lo schermo. -->
<style>
@font-face{font-family:Mark;src:url(../src/fonts/esmaltadas-mark.woff2)}
@font-face{font-family:Manrope;src:url(../src/fonts/manrope-latin-wght-normal.woff2);font-weight:200 800}
@font-face{font-family:Archivo;src:url(../src/fonts/archivo-600-wide.woff2);font-weight:400 700;font-stretch:112% 125%}
html,body{margin:0}
.og{position:relative;width:1200px;height:630px;overflow:hidden;background:rgb(242,232,222)}
.og img{position:absolute;width:1312px;left:-112px;top:var(--top)}
.txt{position:absolute;left:0;right:0;top:var(--ty);text-align:center;color:#84152f}
.mark{font-family:Mark;font-size:66px;line-height:1;white-space:nowrap}
.mark span+span{margin-left:.24em}
.sub{margin-top:22px;font:500 15px/1 Manrope;letter-spacing:.46em;padding-left:.46em;text-transform:uppercase}
.loc{margin-top:26px;font:600 11px/1 Archivo;font-stretch:112%;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;color:#5e464b}
.loc i{display:inline-block;width:4px;height:4px;border-radius:50%;background:#84152f;margin:0 .9em;vertical-align:.2em}
</style></head><body>
<div class="og" style="--top:-722px;--ty:452px"><img src="silk-portrait.png">
<div class="txt"><div class="mark"><span>E</span><span>S</span><span>M</span><span>A</span><span>L</span><span>T</span><span>A</span><span>D</span><span>A</span><span>S</span></div>
<div class="sub">Nail &amp; Beauty Studio</div>
<div class="loc">Tres estudios en Mérida</div></div></div>
</body></html>
