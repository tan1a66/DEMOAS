<!-- L'immagine di anteprima per la condivisione (public/og-image.jpg, 1200 × 630): impaginata qui e
     fotografata con Playwright. Per fotografarla incollare logo e curve di livello nella pagina. -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; } html, body { margin: 0; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #ede8df; display: grid; grid-template-columns: 560px 1fr; }
  .pic { position: relative; background: url(bici.jpg) /* il primo piano di LLEGASTE dalla scena in sella */ center 42% / cover; }
  .pic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(237,232,223,0) 70%, #ede8df 100%); }
  .side { position: relative; padding: 0 70px 0 40px; display: flex; flex-direction: column; justify-content: center; }
  .mark { position: absolute; inset: -10%; color: #2b2b2b; opacity: 0.09; }
  .mark svg { width: 100%; height: 100%; } .mark path { vector-effect: non-scaling-stroke; }
  .logo { position: relative; width: 470px; aspect-ratio: 388 / 95; background: #2b2b2b; -webkit-mask: url(../../src/assets/nomads-logo.png) center / contain no-repeat; mask: url(../../src/assets/nomads-logo.png) center / contain no-repeat; }
  .rule { position: relative; width: 64px; height: 4px; margin: 34px 0 30px; background: #e8622c; }
  .line { position: relative; margin: 0; max-width: 15ch; font-family: Unbounded, sans-serif; font-weight: 400; font-size: 38px; line-height: 1.12; letter-spacing: -0.015em; color: #2b2b2b; }
  .meta { position: relative; margin: 26px 0 0; font-family: Unbounded, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #e8622c; }
</style></head><body>
<div class="card">
  <div class="pic"></div>
  <div class="side">
    <div class="mark" id="mark"><!-- src/assets/contours.svg incollato qui --></div>
    <div class="logo" role="img" aria-label="Nomads Cycling Club"></div>
    <div class="rule"></div>
    <p class="line">El mundo no se visita, se conquista pedaleando.</p>
    <p class="meta">Viajes en bicicleta · Desde México</p>
  </div>
</div>

</body></html>
