<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D9A5A0" />
    <title>Alessia Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- scena 3D: un solo canvas fisso a tutto schermo -->
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- testi sopra il canvas (generati da src/overlay.js con i contenuti di src/content.js) -->
    <div id="overlay"></div>

    <!-- altezza di scroll che guida la telecamera (impostata dal percorso) -->
    <main id="scroll"></main>

    <div id="loader" aria-hidden="true">
      <div class="loader-line"><div class="loader-fill"></div></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
