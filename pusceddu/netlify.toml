# Su Netlify: "Base directory" = pusceddu
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# File con hash nel nome: si possono tenere in cache per sempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pagina riservata: nessun referrer verso l'esterno e nessuna copia nella cache del dispositivo.
[[headers]]
  for = "/assistenza-riservata*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
